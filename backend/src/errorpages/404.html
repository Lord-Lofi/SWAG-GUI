<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Not found</title>
<style>
  :root {
    --bg: #0b0f17; --bg-glow: #13203a; --card: #111827; --border: #1f2937;
    --text: #f3f4f6; --muted: #9ca3af; --faint: #6b7280;
    --accent: #3b82f6; --accent-soft: rgba(59,130,246,.14); --warn: #6b7280;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f7fb; --bg-glow: #e3ebfb; --card: #ffffff; --border: #e5e7eb;
      --text: #111827; --muted: #4b5563; --faint: #9ca3af;
      --accent: #2563eb; --accent-soft: rgba(37,99,235,.10); --warn: #9ca3af;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 24px;
    background: radial-gradient(1200px 600px at 50% -10%, var(--bg-glow), var(--bg) 60%);
    color: var(--text);
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: 100%; max-width: 440px; text-align: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    padding: 40px 32px 32px; box-shadow: 0 24px 60px -24px rgba(0,0,0,.45);
  }
  .icon {
    width: 76px; height: 76px; margin: 0 auto 22px; border-radius: 50%;
    display: grid; place-items: center; background: var(--accent-soft); position: relative;
  }
  .icon::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid var(--accent); opacity: .35; animation: none;
  }
  .icon svg { width: 36px; height: 36px; color: var(--accent); }
  h1 { font-size: 1.35rem; line-height: 1.3; margin: 0 0 10px; letter-spacing: -.01em; }
  p { margin: 0 0 26px; color: var(--muted); }
  .status {
    display: inline-flex; align-items: center; gap: 8px; margin-bottom: 26px;
    font-size: .8rem; color: var(--muted); padding: 6px 12px;
    border: 1px solid var(--border); border-radius: 999px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); animation: none; }
  a.button {
    display: inline-block; text-decoration: none; font-weight: 600; font-size: .95rem;
    background: var(--accent); color: #fff; padding: 10px 22px; border-radius: 10px;
    transition: filter .15s ease, transform .15s ease;
  }
  a.button:hover { filter: brightness(1.1); }
  a.button:active { transform: translateY(1px); }
  a.button:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 3px; }
  small { display: block; margin-top: 22px; color: var(--faint); font-size: .75rem; }
  @keyframes ping { 0% { transform: scale(1); opacity: .45; } 80%, 100% { transform: scale(1.45); opacity: 0; } }
  @keyframes blink { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .icon::after, .dot { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5 5-2z"/>
    </svg>
  </div>
  <h1>There’s nothing here</h1>
  <div class="status"><span class="dot"></span>Check the address for typos</div>
  <p>This address isn’t connected to any service.</p>
  <small>Error 404</small>
</main>
</body>
</html>
