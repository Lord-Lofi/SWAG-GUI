# Strict rules for LinuxServer.io's socket-proxy, used by SWAG Config GUI.
#
# The image's built-in switches (CONTAINERS, EXEC, POST...) work per API
# section. With the ones SWAG-GUI needs switched on, they would also allow
# creating, starting and stopping any container, including a new privileged
# one that mounts the host, which would give root on the server. This file
# replaces the image's template and allows only the four requests SWAG-GUI
# makes, and only for the two SWAG containers:
#
#   POST /containers/<swag>/exec     create an exec (nginx -t, reload, ...)
#   POST /exec/<id>/start            run it and read its output
#   GET  /exec/<id>/json             read its exit code
#   GET  /containers/<swag>/json     read the container's image labels
#
# Everything else is denied. The two container names come from the
# SWAG_EXTERNAL_CONTAINER and SWAG_INTERNAL_CONTAINER environment variables
# of the socket-proxy container (see docker-compose.example.yml).
#
# Mounted read-only over /templates/haproxy.cfg. The image's entrypoint fills
# in the @@...@@ placeholders, exactly as with its own template. Written for
# socket-proxy 3.4.x; check this file still matches when changing the
# image version (see README).

global
    log stdout format raw daemon "${LOG_LEVEL}"
    pidfile /run/haproxy.pid
    maxconn 2000
    user root
    chroot /

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    option redispatch
    retries 3
    timeout http-request 10s
    timeout queue 1m
    timeout connect 10s
    timeout client @@TIMEOUT_CLIENT@@
    timeout server @@TIMEOUT_SERVER@@
    timeout http-keep-alive 10s
    timeout check 10s
    maxconn 2000

backend docker
    server socket $SOCKET_PATH

frontend proxy
    bind @@BIND_PROTO@@

    # Read request bodies, so exec requests can be checked (below)
    option http-buffer-request

    acl exec_create  path,url_dec -m reg "^(/v[0-9.]+)?/containers/(${SWAG_EXTERNAL_CONTAINER}|${SWAG_INTERNAL_CONTAINER})/exec\$"
    acl inspect      path,url_dec -m reg "^(/v[0-9.]+)?/containers/(${SWAG_EXTERNAL_CONTAINER}|${SWAG_INTERNAL_CONTAINER})/json\$"
    acl exec_start   path,url_dec -m reg "^(/v[0-9.]+)?/exec/[a-f0-9]{64}/start\$"
    acl exec_inspect path,url_dec -m reg "^(/v[0-9.]+)?/exec/[a-f0-9]{64}/json\$"

    # An exec must not ask for extra privileges. Docker accepts JSON keys in
    # any letter case and with \u escapes, so any mention of "privileged",
    # any backslash, an unknown length or a large body is refused. SWAG-GUI's
    # own requests are small, fixed and contain none of these.
    acl mentions_privileged req.body -m sub -i privileged
    acl has_escape          req.body -m sub \\
    acl no_length           req.hdr_cnt(content-length) eq 0
    acl too_long            req.hdr_val(content-length) gt 2048
    acl chunked             req.hdr(transfer-encoding) -m found
    http-request deny if METH_POST exec_create mentions_privileged
    http-request deny if METH_POST exec_create has_escape
    http-request deny if METH_POST no_length
    http-request deny if METH_POST too_long
    http-request deny if chunked

    http-request allow if METH_POST exec_create
    http-request allow if METH_POST exec_start
    http-request allow if METH_GET exec_inspect
    http-request allow if METH_GET inspect
    http-request deny

    default_backend docker
